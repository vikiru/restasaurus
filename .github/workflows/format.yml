name: Format Files
run-name: Format files using Biome
on:
  push:
    branches:
      - main
      - dev
permissions: {}

concurrency:
    group: format-${{ github.ref }}
    cancel-in-progress: true
jobs:
    format:
        name: Format
        runs-on: ubuntu-latest
        permissions:
            contents: write # Push formatting changes to the branch.
        steps:
            - name: Checkout repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Setup github-actions[bot] git config
              run: |
                  git config --local user.name "github-actions[bot]"
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "24.22.1"
            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  version: 11.20.0
            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts
            - name: Format files
              run: pnpm run format
            - name: Check for changes
              id: changes
              run: |
                  git add -A
                  if git diff --staged --quiet; then
                    echo "changes_exist=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  else
                    echo "changes_exist=true" >> "$GITHUB_OUTPUT"
                  fi
            - name: Output if changes exist
              env:
                  CHANGES_EXIST: ${{ steps.changes.outputs.changes_exist }}
              run: echo "$CHANGES_EXIST"
            - name: Commit formatting changes via GitHub Actions, if changes exist
              if: steps.changes.outputs.changes_exist == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |-
                  git commit -m "chore: format files via github actions"
                  git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
